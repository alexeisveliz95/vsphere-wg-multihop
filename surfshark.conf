# =============================================================================
# surfshark.conf — Configuracion de Surfshark WireGuard
#
# Coloca este archivo junto a wg-multihop.sh y el install lo leera
# automaticamente. Si no existe, el install preguntara los datos.
#
# Como obtener los datos:
#   1. Ir a https://account.surfshark.com/servers
#   2. Elegir ciudad (usa-atl, usa-ny, usa-la, etc.)
#   3. Descargar configuracion WireGuard
#   4. Extraer: Endpoint, PublicKey, y la IP interna asignada
# =============================================================================

# Ciudad Surfshark (solo referencia)
SS_CITY="usa-atl"

# Endpoint del servidor Surfshark (IP:puerto)
# Ejemplo: "123.123.123.123:51820"
WG1_ENDPOINT=""

# Public key del servidor Surfshark
SS_PUB=""

# IP interna que Surfshark asigna a este VPS en la red wg1
# Normalmente 10.2.0.x/32 (la x la asigna Surfshark)
WG1_VPS_IP="10.2.0.2/32"
